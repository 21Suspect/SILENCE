<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>SILENCE</title>
    <meta name="description" content="A forest at dawn. Something in the fog. An immersive psychological horror experience." />
    <link rel="icon" href="/favicon.svg" />
    <style>
      :root { color-scheme: dark; background: #000; }
      * { box-sizing: border-box; }
      html, body, main { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { overscroll-behavior: none; }
      main { position: fixed; inset: 0; touch-action: none; user-select: none; }
      canvas { width: 100%; height: 100%; display: block; outline: none; }
      main:focus, canvas:focus { outline: none; }
      @media (pointer: coarse) { main { height: 100dvh; -webkit-user-select: none; -webkit-touch-callout: none; } }
    </style>
  </head>
  <body>
    <main id="game" aria-label="SILENCE. Click to enter. WASD to walk, mouse to look, Shift to hurry, Control to crouch, Escape for pause settings. E to interact, Q to drop, O to show or hide the objective, P for the performance overlay."></main>
    <script type="module" src="/game/main.ts"></script>
  </body>
</html>
